<div class="ovi-font-family">
    <div class="ovi-fnt-sze20" style="font-weight: 600; padding: 0px 20px; width: calc(100% - 10px); height: 50px; display: flex ; color: white; background: #13c7b7; justify-content: space-between; align-items: center;">
        <div>{{"Change Location"|translate}}</div>
        <!-- <div>close</div> -->
    </div>
    <div>
        <div style="display: flex ; flex-direction: column; gap: 30px; padding: 20px 10px; align-items: center;">
            <div>
                <span class="dis-custom-label">{{"Select Location"|translate}}</span>
                <mat-form-field appearance="none" class="dis-custom-select">
                    <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Locations'|translate" [formControl]="selectedLocation"
                        (openedChange)="openedChange($event)">
                        <mat-option>
                            <ngx-mat-select-search [formControl]="searchControl" (ngModelChange)="applyFilter($event)" [placeholderLabel]="'Search....'" [noEntriesFoundLabel]="'No matching options'">
                            </ngx-mat-select-search>
                        </mat-option>
                        <mat-option *ngFor="let location of filterLocations" [value]="location.id">
                            {{location.name}}, {{location.floorName}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div style="display: flex;flex-direction: row; gap: 20px;">
                <button class="ovi-fnt-sze18" style="height: 40px; width: 100px; color: white; background: #13c7b7; border-radius: 5px; border: 0px;" (click)="action('close')">{{"Cancel"|translate}}</button>
                <button class="ovi-fnt-sze18" style="height: 40px; width: 100px; color: white; background: #13c7b7; border-radius: 5px; border: 0px;" (click)="action('save')">{{"Save"|translate}}</button>
            </div>
        </div>
    </div>
    
    
</div>
