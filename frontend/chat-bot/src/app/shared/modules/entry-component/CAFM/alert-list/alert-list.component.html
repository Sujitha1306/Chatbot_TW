<div class="mat-tab-content">
    <div class="popup-tab-margin ovi-font-family" style="margin-left: 0px;" >
        <span [formGroup]="alertForm" class="ovi-row-gap ">
            <div>
                <mat-label class="ovi-lbl-text-size ovi-field-label">{{"Start Date"|translate}}</mat-label>
                <mat-form-field class="ovi-row-frmfld-wdh   ovi-matfrmfld-type-datetime-local" appearance="outline">
                    <input matInput type="date" max="{{today | date:'yyyy-MM-dd'}}" formControlName="startDate">
                </mat-form-field>
            </div>
            <div >
                <mat-label class="ovi-lbl-text-size ovi-field-label">{{"End Date"|translate}}</mat-label>
                <mat-form-field class="ovi-row-frmfld-wdh   ovi-matfrmfld-type-datetime-local" appearance="outline">
                    <input matInput type="date" max="{{today | date:'yyyy-MM-dd'}}"
                        min="{{alertForm.controls.startDate.value | date:'yyyy-MM-dd'}}" formControlName="endDate">
                </mat-form-field>
            </div>
            <div class='class="ovi-row-three-clmn"' style="position: relative;top: 15px;">
            <button mat-button class="ovi-btn-primary" appDebounceClick (debounceClick)="getAssetAlertHistoryData(entityData.entityId ,entityData.entityType,pageStart,pageSize)"
                [debounceTime]="300" cdkFocusInitial>{{"Go"|translate}}</button>
            </div>
        </span>
    </div>
    <div *ngIf="alertDataHistory.length != 0" style="padding:10px 10px 10px 15px;">
    <tw-table-component [component]="'assetAlert'" [columns]="alertDisplayedColumn" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="alertIconColumn" [sortColumn]="sortColumn"
        [eventColumn]="eventColumn"(eventAction)="eventAction($event,assetAlert)" [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" ></tw-table-component>
    </div>
    <div *ngIf="alertDataHistory.length === 0" class ="no-shift">{{"No records Found"|translate}}</div>
</div>
