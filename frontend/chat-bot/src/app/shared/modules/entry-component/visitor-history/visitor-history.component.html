<div class="input-component-holder ovi-font-family" style="height:100% ;width:100%;">
    <div class="ovi-pop-hdr">
        <div>{{"Visitors History"|translate}}</div>
        <div mat-dialog-close><mat-icon>highlight_off</mat-icon></div>
    </div>

    <div class="ovi-matfrmfld ovi-matfrmfld-box-top-btm-pdg popup-margin" style="overflow: auto;height:calc(100% - 135px);width: calc(100% - 30px);">
        <div style="padding: 0 0 10px 0;">
            <span class="map-table-filter">
              <input matInput  #searchInputClear   [formControl]="filterKey" (keyup)="applyFilter(filterKey.value)"
               autocomplete="off" style="padding: 5px !important; height: 20px; color: black;" appPlaceholder [showPlaceholder]="true" [placeholderText]="'Search'|translate">
               <button mat-icon-button matSuffix aria-label="clear" *ngIf="searchInputClear.value" (click)="searchInputClear.value=''; applyFilter('');"
                  style="position: relative;bottom: 8px;left: 10px;">
                      <span class="tw-filter-close">x</span>
                  </button> 
            </span>
        </div>        
        <div>
            <angular-table-component [id]="'visitors-hsy'" [type]="'ng-table'" [tableData]="tableDataHistory"
            [columns]="['Type', 'Name','Event Name','EventDate']" [component]="'visitorhistory'"
            [columnData]="['typeName', 'name','eventname','date']"
            [pageSizeOptions]="[5, 10, 15, 20, 30]">
            </angular-table-component>       
        </div>
   
    </div>
