<div class="ovi-font-family" style="width: 100%; height: 100%;">
    <mat-toolbar class="input-header">
        <div class="header-name" style="width: 93% !important;">{{"Navigation"|translate}}</div>
        <div class="header-close">
            <button mat-icon-button mat-dialog-close class="close-button ie-close-icon">
                <mat-icon class="icon-style">highlight_off</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <div style="height: 82%;">
        <div>
        <div style="display: flex; height: 40%; width: 100%;">
            <span style="display: flex; width: 60%; margin-top: 30px; margin-left: 20%; margin-right: 20%;">
            <mat-label class="ovi-fnt-sze15" style="width:50%; background: #019F96;color: #fff;padding: 10px 10px; text-align: center;">{{"Choose Tag"|translate}}</mat-label>
            <span style="width: 100%; padding: 10px 8px 4px 8px;border: 1px solid #F0F0F0 !important; background: #fff; box-shadow: 1px 2px 6px #00000029;">
            <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Choose'|translate">
            <mat-option >1</mat-option>
            </mat-select>
            </span>
            </span>
        </div>
        <div style="display: flex; height: 40%; width: 100%;">
            <span style="display: flex; width: 60%; margin-top: 30px; margin-left: 20%; margin-right: 20%;">
            <mat-label class="ovi-fnt-sze15" style="width:50%; background: #019F96;color: #fff;padding: 10px 10px; text-align: center;">{{"Select Block"|translate}}</mat-label>
            <span style="width: 100%; padding: 10px 8px 4px 8px;border: 1px solid #F0F0F0 !important; background: #fff; box-shadow: 1px 2px 6px #00000029; ">
            <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Select'|translate" [formControl]="blockId" (selectionChange)="onBlockChange($event.value)">
            <mat-option *ngFor="let block of blockList" [value]="block.id">{{block.name}}</mat-option>
            </mat-select>
            </span>
            </span>
        </div>
        <div style="display: flex; height: 40%; width: 100%;">
            <span style="display: flex; width: 60%; margin-top: 30px; margin-left: 20%; margin-right: 20%;">
            <mat-label class="ovi-fnt-sze15" style="width:50%; background: #019F96;color: #fff;padding: 10px 10px; text-align: center;">{{"Select Floor"|translate}}</mat-label>
            <span style="width: 100%; padding: 10px 8px 4px 8px;border: 1px solid #F0F0F0 !important; background: #fff; box-shadow: 1px 2px 6px #00000029;">
            <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Select'|translate" [formControl]="floorId" (selectionChange)="onFloorChange($event.value)">
            <mat-option *ngFor="let floor of floorList" [value]="floor.id">{{floor.name}}</mat-option>
            </mat-select>
            </span>
            </span>
        </div>
        <div style="display: flex; height: 40%; margin: 30px 60px;">
            <span style="display: flex; width: 100%;">
            <mat-label class="ovi-fnt-sze15" style="background: #019F96;color: #fff;padding: 10px 10px;text-align: center;">{{"Location"|translate}}</mat-label>
            <span style="width: 100%;padding: 5px 8px 7px 8px;border: 1px solid #F0F0F0 !important;background: #fff;box-shadow: 1px 2px 6px #00000029;">
            <input appNoSpace matInput style="vertical-align: middle;" appPlaceholder [showPlaceholder]="true" [placeholderText]="''|translate"  [matAutocomplete]="auto" [formControl]="locationId" (keyup)="searchLocation($event)">
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
              <mat-option *ngFor="let option of searchLoclist" value="{{option.name}} {{option.fullName}}">
                <div >{{option.name}}, {{option.fullName}}</div>
              </mat-option>
            </mat-autocomplete>
            </span>
            </span>
        </div>
        </div>
    </div>
    <div class="input-footer">
        <button mat-button class="cancle-btn" mat-dialog-close>{{"Cancel"|translate}}</button>
        <button mat-button class="active-btn m-r-1" cdkFocusInitial>{{"Publish"|translate}}</button>
    </div>
</div>
