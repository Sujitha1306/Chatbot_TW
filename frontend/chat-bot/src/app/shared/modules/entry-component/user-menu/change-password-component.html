<div class="input-component-holder ovi-font-family" style="height:100% ;width:100%;">
    <div class="ovi-pop-hdr">
        <div >{{"Change Password"|translate}}</div>
        <div mat-dialog-close><mat-icon>highlight_off</mat-icon></div>
    </div>
    <div class="ovi-matfrmfld ovi-matfrmfld-box-top-btm-pdg popup-margin">
        <form [formGroup]="passwordForm" novalidate>
            <div style="padding: 10px;display: flex ;gap: 10px 0;flex-direction: column;">
             <div class="ovi-matfrmfld-input-box-pdg" style="width: 80%;display: flex;">
              <mat-label class="ovi-lbl-text-size" style="display: flex; width: 130px; align-items: center;">{{"Old Password"|translate}} : </mat-label>
                <mat-form-field class="ovi-row-frmfld-wdh ovi-matfrmfld-err" appearance ='outline'>
                    <input matInput appPlaceholder [showPlaceholder]="false" [placeholderText]="'Old Password'|translate" [type]="hide ? 'text' : 'password'"
                        required formControlName="oldPassword" [errorStateMatcher]="matcher" autocomplete="off">
                    <!-- <mat-icon matSuffix (click)="hide = !hide" class="float-r">
                        {{hide ? 'vpn_key' : 'visibility_off'}}</mat-icon> -->
                        <span matSuffix (click)="hide = !hide" class="float-r" class="material-icons ovi-fnt-sze20" style="color: darkgray;padding: 5px;" (keydown.enter)="fixClick()">{{hide ? 'vpn_key_off' : 'vpn_key'}}</span>
                    <mat-error *ngIf="!passwordForm.controls.oldPassword.valid">
                        <span 
                            [hidden]="!passwordForm.controls['oldPassword'].errors.required && !passwordForm.controls['oldPassword'].touched">{{Password
                            is required"|translate}}.</span>
                    </mat-error>
                </mat-form-field>
             </div>
                <div class="ovi-matfrmfld-input-box-pdg" style="width: 80%;display: flex;">
                <mat-label class="ovi-lbl-text-size" style="display: flex; width: 130px; align-items: center;">{{"New Password"|translate}} : </mat-label>
                <mat-form-field class="ovi-row-frmfld-wdh ovi-matfrmfld-err" appearance ='outline'>
                    <input matInput appPlaceholder [showPlaceholder]="false" [placeholderText]="'New Password'|translate" type="password"
                        formControlName="newPassword" [errorStateMatcher]="matcher" maxlength="26">
                    <mat-error *ngIf="!passwordForm.controls.newPassword.valid">
                        <span 
                            [hidden]="!passwordForm.controls['newPassword'].errors.required && !passwordForm.controls['newPassword'].touched">{{New
                            Password is required"|translate}}.</span>
                    </mat-error>
                </mat-form-field>
                </div>
                <div class=" ovi-matfrmfld-input-box-pdg" style="width: 80%;display: flex;">
                <mat-label class="ovi-lbl-text-size" style="display: flex; width: 130px; align-items: center;">{{Confirm New Password"|translate}} : </mat-label>
                <mat-form-field class="ovi-row-frmfld-wdh ovi-matfrmfld-err" appearance ='outline'>
                    <input matInput appPlaceholder [showPlaceholder]="false" [placeholderText]="'Confirm New Password'|translate" type="password"
                        formControlName="cnfrmNewPassword" [errorStateMatcher]="matcher" maxlength="26">
                    <mat-error 
                        *ngIf="passwordForm.controls['cnfrmNewPassword'].pristine || passwordForm.controls['cnfrmNewPassword'].errors?.MatchPassword">
                        {{Password does not match"|translate}}</mat-error>
                </mat-form-field>
            </div>
        </div>
            <div style="display: flex;justify-content: center;position: relative;top: 15px">
                <button mat-button class="active-btn" (click)="resetPassword();"
                    [disabled]="passwordForm.controls['cnfrmNewPassword'].pristine || passwordForm.controls['cnfrmNewPassword'].errors?.MatchPassword">{{Reset
                    Password"|translate}}</button>
            </div>
        </form>
    </div>
</div>
