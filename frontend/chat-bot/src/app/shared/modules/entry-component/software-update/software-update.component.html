<div fxFlex class="input-component-holder form-body-frame">
    <mat-toolbar class="input-header">
        <div class="header-name">{{"Software Update"|translate}}</div>
        <div class="header-close">
            <button mat-icon-button mat-dialog-close close-button>
                <mat-icon class="icon-style">highlight_off</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <div class="input-container inner-frm-glb">
        <div class="form_body form-body-frame_1">
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" class="form-row">
                <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
                    <div class="example-form">
                        <mat-form-field class="example-full-width form-field">
                            <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Reader'|translate">
                                <mat-option [value]="'test'">Reader</mat-option>
                                <mat-option [value]="'test1'">Mini Reader</mat-option>
                                <mat-option [value]="'test2'">Tag UWB</mat-option>
                                <mat-option [value]="'test2'">Tag BLE</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
                    <!-- <mat-form-field>
                        <mat-select placeholder="Type" [formControl]="toppings" multiple>
                            <mat-select-trigger>
                            {{toppings.value ? toppings.value[0] : ''}}
                            <span *ngIf="toppings.value?.length > 1" class="example-additional-selection">
                                (+{{toppings.value.length - 1}} {{toppings.value?.length === 2 ? 'other' : 'others'}})
                            </span>
                            </mat-select-trigger>
                            <mat-option *ngFor="let topping of toppingList" [value]="topping">{{topping}}</mat-option>
                        </mat-select>
                    </mat-form-field> -->
                </div>
            </div>
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" class="form-row">
                <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
                    <div class="example-form">
                        <mat-form-field class="example-full-width form-field">
                            <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Version'|translate">
                                <mat-option [value]="'test'">Reader</mat-option>
                                <mat-option [value]="'test1'">Mini Reader</mat-option>
                                <mat-option [value]="'test2'">Tag UWB</mat-option>
                                <mat-option [value]="'test2'">Tag BLE</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
                    <!-- <mat-form-field>
                        <mat-select placeholder="Url path" [formControl]="toppings" multiple>
                            <mat-select-trigger>
                            {{toppings.value ? toppings.value[0] : ''}}
                            <span *ngIf="toppings.value?.length > 1" class="example-additional-selection">
                                (+{{toppings.value.length - 1}} {{toppings.value?.length === 2 ? 'other' : 'others'}})
                            </span>
                            </mat-select-trigger>
                            <mat-option *ngFor="let topping of toppingList" [value]="topping">{{topping}}</mat-option>
                        </mat-select>
                    </mat-form-field> -->
                </div>
            </div>
        </div>
    </div>
    <div class="input-footer">
        <button mat-button class="cancle-btn" mat-dialog-close>{{"Cancel"|translate}}</button>
        <button mat-button class="active-btn margin-r-1" mat-dialog-close (click)=updateSoftware() cdkFocusInitial>{{"Update"|translate}}</button>
    </div>
</div>
