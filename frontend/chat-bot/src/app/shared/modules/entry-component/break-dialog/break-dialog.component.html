<div class="custom-dialog-box">
    <mat-toolbar class="input-header">
        <div class="header-name" style="width: 93% !important;">{{"Add Break"|translate}}</div>
        <div class="header-close" style="padding:18px">
            <button mat-icon-button mat-dialog-close class="close-button ie-close-icon">
                <mat-icon class="icon-style">highlight_off</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <div style="height: 60%;">
        <div style="padding-top: 22px;column-gap: 22px;display: flex;justify-content: center;">
            <mat-radio-group [formControl]="breakType">
                <mat-radio-button value="BKT-BRK"  class="ovi-fnt-sze14">{{"Break"|translate}}</mat-radio-button>
                <mat-radio-button value="BKT-LCH" class="ovi-fnt-sze14">{{"Lunch"|translate}}</mat-radio-button>
            </mat-radio-group>
        </div>
        <div style="padding-top: 38px;display: flex;justify-content: center;">
            <span class="ovi-fnt-sze16" style="padding-left:5px;">{{"Duration"|translate}}:&nbsp;</span>
            <select class="custom-select ovi-font-family ovi-fnt-sze13" [formControl]="duration" style="padding-top: 2px;padding-bottom: 6px;width: 35%;height: 25px;">
                <option *ngFor="let i of durationList; let j = index" value="{{i.value}}">{{i.code}}</option>
            </select>
        </div>
    </div>
    <div class="input-footer">
        <button mat-button class="cancle-btn" mat-dialog-close>{{"Cancel"|translate}}</button>
        <button mat-button class="active-btn m-r-1" cdkFocusInitial appDebounceClick (debounceClick)="addBreak()" [debounceTime]="300">{{"Add"|translate}}</button>
    </div>
</div>
