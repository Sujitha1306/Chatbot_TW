<div class="input-component-holder ovi-font-family" style="height:100% ;width:100%;">
    <div *ngIf="displayHeader" class="ovi-pop-hdr">
        <div > {{titleName |translate}} <span>
            
        </span> </div>
        <div mat-dialog-close><mat-icon>highlight_off</mat-icon></div> 
    </div>
    <div style="padding: 5px 10px;">
        <div style="margin-left: -15px;">
            <tw-header-new-component [type]="'new'" [component]="'manageRoutine'" [permission]="null" [dateFilter]="null" [rowFilter]="null"
            [manageAction]="showActions" [selectDropdown]="null" [selectedName]="true" [selectedView]="null"
            [multiView]="false" (selectedViewAction)="null" [groupFilter]="groupFilter" [isDateClear]="false"
            (headerEventAction)="headerEventAction($event)"></tw-header-new-component>
        </div>
        <div>
            <tw-table-component [component]="'manageRoutine'" [columns]="displayedColumns" [tableData]="tableData"
            [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
            (eventAction)="eventAction($event)"  [rowId]="'id'" [dateColumns]="dateColumns" [timeColumns] = "timeColumns"
            [applyFilter]="applyFilterValue" [rowDbClick]="false" (rowDbClickAction)="createRoutine($event)"
             [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]"></tw-table-component>
        </div>
    </div>
</div>
