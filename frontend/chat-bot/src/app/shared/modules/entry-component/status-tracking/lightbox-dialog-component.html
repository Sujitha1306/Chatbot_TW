<div class="ovi-font-family" style="width: 100%; height: 100%; background-color: inherit;overflow: hidden;">
    <mat-toolbar class="input-header" class="bg-clr" style="height: 10%;background-color: inherit;">
        <div class="header-close" style="width: 100%;margin-left: calc(100% - 50px);">
            <button mat-icon-button mat-dialog-close close-button>
                <mat-icon class="icon-style_1  ovi-fnt-sze35" style="color:white; height: 27px;width: 40px; padding-top:10px;">highlight_off</mat-icon>
            </button>
        </div>
    </mat-toolbar>
    <div *ngIf="this.type == 'qrcode'" style="display: inline-flex; width: 100%; margin-top: 155px; justify-content: center;" (click)="closeDialog()" (keydown.enter)="fixClick()">
        <div *ngFor="let data of barcodearray; let i = index" style="background-color: inherit;overflow: hidden;">
            <qrcode [elementType]="'svg'" [qrdata]="data" [errorCorrectionLevel]="'M'" [width]="250"
                [scale]="selectedFontSize" [margin]="selectedMargins" [colorDark]="colorDark"></qrcode>
        </div>
    </div>
    <div *ngIf="this.type != 'qrcode'">
        <div style="width: 100%; height: 80%; background-color: inherit;overflow: auto;">
            <div style="height: 80%;margin-left: 10%;margin-right: 10%;">
                <img [src]="data.url" class="clickToEnlarge img-enlg"  alt="data"
                    *ngIf="data.type != 'application/pdf' && data.type != 'application/msword' && data.type != 'text/plain'">
                    <object style="width: 100%; height: 100%;" *ngIf="data.type == 'application/pdf'" [data]="urlSafe" type="application/pdf"></object>
                <div style="height: 100%;width:100%; text-align: center; background-color: white;"
                    *ngIf="data.type == 'application/msword'"> {{"Please click download to preview"|translate}}.
                    <button mat-button style="background:#317eed; color: white; margin-left: 10px; margin-top: 215px;"
                        (click)="downloadPreview();">{{"Download"|translate}}</button>
                </div>
            </div>
            <object style="width: 100%; height: 100%; background: white;" *ngIf="isDownload" [data]="this.urlSafe" type="application/pdf">
            </object>
            <pre style="width: 100%; height: 100%; overflow:auto; background: white;" *ngIf="data.type == 'text/plain'" >{{data.url}}</pre>
        </div>
        <div class="input-footer" style="float: right;padding: 10px;">
            <button mat-button class="cancle-btn" mat-dialog-close>{{"Cancel"|translate}}</button>
        </div>
    </div>
</div>
