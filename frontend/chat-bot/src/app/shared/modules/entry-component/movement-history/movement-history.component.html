<div style="padding-top: 7px;">
    <div class="mat-tab-content">
        <div class="movement-padding ovi-font-family">
            <span [formGroup]="dateHistoryForm" class="ovi-row-gap">
                <div class="ovi-row-three-clmn">
                    <mat-label class="ovi-lbl-text-size">{{"Start Date"|translate}}</mat-label>
                    <mat-form-field class="ovi-row-frmfld-wdh   ovi-matfrmfld-type-datetime-local" appearance="outline">
                    <input matInput  type="date" max="{{today | date:'yyyy-MM-dd'}}" formControlName="fromDate">
                    </mat-form-field>
                </div>
                <div class="ovi-row-three-clmn">
                    <mat-label class="ovi-lbl-text-size">{{"End  Date"|translate}}</mat-label>
                    <mat-form-field class="ovi-row-frmfld-wdh   ovi-matfrmfld-type-datetime-local" appearance="outline">
                    <input matInput  type="date" max="{{today | date:'yyyy-MM-dd'}}"
                        min="{{dateHistoryForm.controls.fromDate.value | date:'yyyy-MM-dd'}}"
                        formControlName="toDate">
                    </mat-form-field>
                </div>         
                <div class="ovi-row-three-clmn" style="position: relative;top: 20px;">
                    <button mat-button class="active-btn" appDebounceClick (debounceClick)="getGoHistoryData()"
                        [debounceTime]="300" cdkFocusInitial>{{"Go"|translate}}</button>
                </div>
            </span>
        </div>
        <div *ngIf="dataSourceHistory.length != 0" style="padding:10px 10px 10px 15px;">
            <tw-table-component [component]="'MovementHistory'" [columns]="displayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn"
            [eventColumn]="eventColumn" (eventAction)="eventAction($event)" [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" ></tw-table-component>
        </div>
        <div *ngIf="dataSourceHistory.length === 0" class="no-shift">{{"No records Found"|translate}}</div>
    </div>
</div>
