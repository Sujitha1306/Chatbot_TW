<div class="chat-toggle-button" (click)="toggleChat()">
    <svg *ngIf="!isChatEnabled" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <svg *ngIf="isChatEnabled" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
</div>

<div class="chatbox-container ovi-font-family" [class.visible]="isChatEnabled">
    <div class="chatbox-header">
        <h3>AI Assistant</h3>
        <span class="powered-by">3D Map Assistant</span>
    </div>

    <div class="chatbox-messages" #messageContainer>
        <div *ngFor="let message of messages" class="message-wrapper"
            [class.user-message-wrapper]="message.sender === 'user'"
            [class.ai-message-wrapper]="message.sender === 'ai'">
            <div class="message" [class.user-message]="message.sender === 'user'"
                [class.ai-message]="message.sender === 'ai'">
                <div class="message-text">{{ message.text }}</div>
                <div class="message-timestamp">{{ message.timestamp | date:'short' }}</div>
            </div>
        </div>

        <div *ngIf="isAiTyping" class="message-wrapper ai-message-wrapper">
            <div class="message ai-message typing-indicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>

    <div class="chatbox-input">
        <input type="text" [(ngModel)]="userInput" (keypress)="onKeyPress($event)" placeholder="Type your message..."
            [disabled]="isAiTyping" class="input-field">
        <button (click)="sendMessage()" [disabled]="!userInput.trim() || isAiTyping" class="send-button">
            Send
        </button>
    </div>
</div>
