<div style="height: calc(100% - 50px);">
    <div class="floor-map-container">
        <div class="leftButton">
            <mat-icon class = "slide-widget cur-ptr" *ngIf="leftarrow" (click) = "arrow_left(dataSourceActive)" (keydown.enter)="fixClick()">arrow_left</mat-icon>
        </div>
        <div class="centerBody">
            <div id="blockId" class="blockClass"> </div>
            <span *ngIf="dataSource">{{dataSource.name}}</span>
        </div>
        <div class="rightButton">
            <mat-icon class="slide-widget2 cur-ptr" *ngIf="rightarrow" (click) = "arrow_right(dataSourceActive)" (keydown.enter)="fixClick()">arrow_right</mat-icon>
        </div>          
    </div>
</div>
