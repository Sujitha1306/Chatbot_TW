<div class="offline-popup">
  <div class="wifi-icon">
   <img src="/assets/icons/NoConnection.svg">
  </div>
  <h2 class="popup-title">No Internet Connection</h2>

  <p class="popup-subtitle">
    Please check your network settings and try again.
  </p>

  <button class="popup-btn" mat-button (click)="retry()">
    Retry Connection
  </button>
</div>
