<div class="welcome-container">
  <div *ngIf="dialogRef" style="height: 30px;width: calc(100% - 5px);" (click)="closePopup()"><mat-icon style="float: right;">highlight_off</mat-icon></div>

  <div [style.height]="dialogRef ? 'calc(100% - 30px)' : '100%'" style="display: flex; min-height: 0;">

    <app-sidebar
      *ngIf="dialogRef"
      [embedded]="true"
      (conversationSelect)="onSidebarSelectConversation($event)"
      (newChatClick)="onSidebarNewConversation()"
      style="flex-shrink: 0;"
    ></app-sidebar>

    <div style="flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;">
      <ng-container *ngIf="!showThread; else threadView">
        <div class="welcome-content" style="height: 100%;cursor: pointer;">

          <h1 class="welcome-title">TrackerWave Analytics</h1>
          <p class="welcome-subtitle">What would you like to explore today?</p>

          <!-- 2x2 Suggestion Cards -->
          <div class="suggestions-grid">
            <button *ngFor="let s of suggestions" (click)="selectSuggestion(s.query)" class="suggestion-card group">
              <div class="card-icon">
                <mat-icon>{{ s.icon }}</mat-icon>
              </div>
              <div class="card-text">
                <p class="card-title">{{ s.title }}</p>
                <p class="card-desc">{{ s.subtitle }}</p>
              </div>
              <mat-icon class="chevron-icon">chevron_right</mat-icon>
            </button>
          </div>
        </div>

        <!-- Input Area Anchored to Bottom -->
        <div class="input-bar-container">
          <div class="input-wrapper">
            <div class="chat-input-box">

              <textarea
                [(ngModel)]="inputValue"
                (keydown)="onKeydown($event)"
                placeholder="Ask anything about your operations..."
                rows="1"
                class="chat-textarea"
              ></textarea>

              <button (click)="send()" [disabled]="!inputValue.trim()" class="send-button">
                <span *ngIf="inputValue.trim()">Send ›</span>
                <span *ngIf="!inputValue.trim()">Send ›</span>
              </button>
            </div>
            <p class="disclaimer">AI-powered analytics can make mistakes. Verify important data.</p>
          </div>
        </div>
      </ng-container>

      <ng-template #threadView>
        <app-chat-thread [conversationId]="activeConversationId" style="height: 100%; display: flex; flex-direction: column; min-height: 0;"></app-chat-thread>
      </ng-template>
    </div>
  </div>
</div>
