<div class="sidebar-wrapper ovi-font-family" [class.collapsed]="collapsed">
  <mat-toolbar color="primary" class="sidebar-header">
    <div class="logo-area" *ngIf="!collapsed">
      <img src="https://demo.trackerwave.com/assets/icons/AI2.svg" alt="Track GenAI Logo" class="sidebar-logo">
      <span style="font-family: 'Open Sans', sans-serif;">Track GenAI</span>
    </div>
    <div class="header-actions">
      <button mat-icon-button (click)="newChat()" title="New Chat" color="primary">
        <mat-icon>add</mat-icon>
      </button>
      <button mat-icon-button (click)="toggle.emit()">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <div class="sidebar-content">
    
    <!-- Search -->
    <div class="search-area" *ngIf="!collapsed">
      <mat-form-field appearance="outline" class="w-full search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="searchQuery" placeholder="Search conversations...">
      </mat-form-field>
    </div>

    <!-- Recommendations -->
    <ng-container *ngIf="!collapsed">
      <ng-container *ngIf="recommendations$ | async as recommendations">
        <div *ngIf="recommendations.length > 0" class="recommendations">
          <div class="recents-header" (click)="toggleRecommendations()" style="cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem;">
            <p class="section-title" style="margin: 0;">Frequent Questions</p>
            <mat-icon style="color: #6b7280; font-size: 1.25rem; width: 1.25rem; height: 1.25rem;">{{ showRecommendations ? 'expand_more' : 'chevron_right' }}</mat-icon>
          </div>
          <mat-nav-list *ngIf="showRecommendations" dense>
            <a mat-list-item *ngFor="let rec of recommendations | slice:0:5" (click)="fillRecommendation(rec)">
              <div class="custom-list-content">
                <span class="rec-text" [title]="rec">{{ rec }}</span>
              </div>
            </a>
          </mat-nav-list>
        </div>
      </ng-container>
    </ng-container>

    <!-- Conversation List -->
    <div class="conv-list" *ngIf="!collapsed">
      
      <!-- Pinned -->
      <ng-container *ngIf="pinned$ | async as pinned">
        <div *ngIf="pinned.length > 0">
          <div class="recents-header" (click)="togglePinned()">
            <p class="section-title">Pinned</p>
            <mat-icon>{{ showPinned ? 'expand_more' : 'chevron_right' }}</mat-icon>
          </div>
          <mat-nav-list *ngIf="showPinned" dense>
            <mat-list-item *ngFor="let c of pinned; trackBy: trackByConvId" 
                           [class.active]="chat.activeConvId === c.id"
                           (click)="selectConv(c.id)">
              <div class="custom-list-content">
                <span class="conv-title" *ngIf="editingConvId !== c.id" [title]="c.title">{{ c.title }}</span>
                
                <div *ngIf="editingConvId === c.id" (click)="$event.stopPropagation()" class="edit-mode">
                  <input matInput [(ngModel)]="editConvName" 
                         (keyup.enter)="saveEditConv($event, c.id)"
                         (keyup.escape)="cancelEditConv($event)" autoFocus>
                  <button mat-icon-button color="primary" (click)="saveEditConv($event, c.id)"><mat-icon>check</mat-icon></button>
                  <button mat-icon-button color="warn" (click)="cancelEditConv($event)"><mat-icon>close</mat-icon></button>
                </div>

                <div class="hover-actions" *ngIf="editingConvId !== c.id">
                  <button mat-icon-button class="meta-action fav-action"
                          (click)="togglePin($event, c)" title="Unpin">
                    <mat-icon class="pin-icon crossed-pin">push_pin</mat-icon>
                  </button>

                  <button mat-icon-button class="meta-action" 
                          [matMenuTriggerFor]="convMenu" 
                          (click)="$event.stopPropagation()">
                    <mat-icon>more_horiz</mat-icon>
                  </button>
                </div>
                
                <mat-menu #convMenu="matMenu">
                  <button mat-menu-item (click)="startEditConv($event, c)">
                    <mat-icon>edit</mat-icon>
                    <span>Rename</span>
                  </button>
                  <button mat-menu-item (click)="deleteConv($event, c.id)">
                    <mat-icon color="warn">delete</mat-icon>
                    <span class="warn-text">Delete</span>
                  </button>
                </mat-menu>
              </div>
            </mat-list-item>
          </mat-nav-list>
        </div>
      </ng-container>

      <ng-container *ngIf="filteredConvs$ | async as filteredConvs">
        <div class="recents-header" (click)="toggleRecents()">
          <p class="section-title">Recents</p>
          <mat-icon>{{ showRecents ? 'expand_more' : 'chevron_right' }}</mat-icon>
        </div>
        
        <mat-nav-list *ngIf="showRecents" dense>
          <mat-list-item *ngFor="let c of filteredConvs; trackBy: trackByConvId" 
                         [class.active]="chat.activeConvId === c.id"
                         (click)="selectConv(c.id)">
            <div class="custom-list-content">
              
              <span class="conv-title" *ngIf="editingConvId !== c.id" [title]="c.title">{{ c.title }}</span>
              
              <div *ngIf="editingConvId === c.id" (click)="$event.stopPropagation()" class="edit-mode">
                <input matInput [(ngModel)]="editConvName" 
                       (keyup.enter)="saveEditConv($event, c.id)"
                       (keyup.escape)="cancelEditConv($event)" autoFocus>
                <button mat-icon-button color="primary" (click)="saveEditConv($event, c.id)"><mat-icon>check</mat-icon></button>
                <button mat-icon-button color="warn" (click)="cancelEditConv($event)"><mat-icon>close</mat-icon></button>
              </div>

                <div class="hover-actions" *ngIf="editingConvId !== c.id">
                  <button mat-icon-button class="meta-action fav-action"
                          (click)="togglePin($event, c)" [title]="c.is_favorite ? 'Unpin' : 'Pin'">
                    <!-- If using outlined icons, one could use keep_outline. Since standard Material doesn't have an empty push_pin, we can just use push_pin. The screenshot shows a push_pin icon with a cross when unpinning. We can use push_pin. -->
                    <mat-icon class="pin-icon" [class.crossed-pin]="c.is_favorite" [style.opacity]="c.is_favorite ? '1' : '0.5'">push_pin</mat-icon>
                  </button>

                  <button mat-icon-button class="meta-action" 
                          [matMenuTriggerFor]="convMenu" 
                          (click)="$event.stopPropagation()">
                    <mat-icon>more_horiz</mat-icon>
                  </button>
                </div>
                
                <mat-menu #convMenu="matMenu">
                <button mat-menu-item (click)="startEditConv($event, c)">
                  <mat-icon>edit</mat-icon>
                  <span>Rename</span>
                </button>
                <button mat-menu-item (click)="deleteConv($event, c.id)">
                  <mat-icon color="warn">delete</mat-icon>
                  <span class="warn-text">Delete</span>
                </button>
              </mat-menu>
            </div>
          </mat-list-item>
        </mat-nav-list>
      </ng-container>
    </div>

  </div>


</div>

<div *ngIf="!collapsed" class="resizer" (mousedown)="startResize($event)" [class.resizing]="isResizing"></div>
