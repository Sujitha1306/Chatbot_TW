<mat-sidenav-container class="chat-container" autosize>
  <mat-sidenav 
    #sidenav 
    [mode]="isMobile ? 'over' : 'side'" 
    [opened]="isMobile ? !sidebarCollapsed : true" 
    (closed)="sidebarCollapsed = true"
    [style.width]="sidebarCollapsed ? '4rem' : 'auto'"
    style="background-color: #ffffff; border-right: 1px solid #e5e7eb; overflow-x: hidden;">
    
    <app-sidebar
      [collapsed]="sidebarCollapsed"
      (toggle)="toggleSidebar()"
    ></app-sidebar>
    
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col bg-white overflow-hidden h-full">
    <!-- Mobile header to toggle sidebar -->
    <div class="mobile-chat-header" *ngIf="isMobile">
      <button (click)="toggleSidebar()" class="menu-toggle-btn">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="header-title">Analytics Assistant</span>
    </div>
    
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
