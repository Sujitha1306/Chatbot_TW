<div class="chat-thread-container ovi-font-family">
  <!-- Chat Area -->
  <div class="messages-container" #scrollContainer (scroll)="onScroll($event)">
    <div class="messages-list">
      
      <div *ngIf="(isFetchingChat$ | async) && !(messages$ | async)?.length" class="initial-loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="isLoadingOlder" class="loading-older">
        <mat-spinner diameter="30"></mat-spinner>
      </div>

      <!-- Messages -->
      <ng-container *ngFor="let msg of (messages$ | async); trackBy: trackById">
        <div class="message-block">
          <app-user-message *ngIf="msg.role === 'user'" [message]="msg" (editSubmit)="onUserMessageEdit($event)"></app-user-message>
          <app-assistant-message
            *ngIf="msg.role === 'assistant'"
            [message]="msg"
            (followupClick)="onFollowupClick($event)"
          ></app-assistant-message>
        </div>
      </ng-container>
      <div #scrollAnchor class="scroll-anchor"></div>
    </div>
  </div>

  <!-- Input bar -->
  <div class="input-bar-container">
    <div class="input-wrapper">
      <!-- <div class="filter-row-container">

      </div> -->
      <div class="chat-input-box">
        <textarea
          [(ngModel)]="inputValue"
          (keydown)="onKeydown($event)"
          placeholder="Ask anything about Porters or Assets..."
          rows="1"
          class="chat-textarea"
        ></textarea>
        
        <!-- Send Button -->
        <button (click)="send()" *ngIf="!(isStreaming$ | async)" [disabled]="!inputValue.trim()" class="send-button">
          <span *ngIf="inputValue.trim()">Send ›</span>
          <span *ngIf="!inputValue.trim()">Send ›</span>
        </button>

        <!-- Stop Button -->
        <button (click)="stop()" *ngIf="isStreaming$ | async" class="send-button stop-button">
          <mat-icon>stop</mat-icon>
        </button>
      </div>
      <p class="disclaimer">
        AI-powered analytics can make mistakes. Verify important data.
      </p>
    </div>
  </div>
</div>
