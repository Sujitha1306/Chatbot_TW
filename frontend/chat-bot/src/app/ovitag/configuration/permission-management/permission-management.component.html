<div  class="loading-spinner" *ngIf="loading">
  <div class="spinnerload">
      <div class="spin1"></div>
      <div class="spin2"></div>
      <div class="spin3"></div>
  </div>
</div> 
<div class="manage-body">
  <div>
    <tw-header-new-component [type]="'new'" [component]="'manage-permission'" [permission]="null" [dateFilter]="null" [rowFilter]="null"
      [manageAction]="showActions" [selectDropdown]="selectDropdown" [groupFilter]="groupFilter"
      [selectedName]="selectedName !== null ? selectedName : true" [locationId]="null" [selectedView]="null"
      [multiView]="false" (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)">
    </tw-header-new-component>
  </div>
  <div class="tw-content1 table-align">
    <tw-table-component [component]="'manage-permission'" [columns]="displayedColumns" [tableData]="tableData"
      [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
      [rowClick]="true" [rowId]="'id'" [rowDbClick]="false" [applyFilter]="applyFilterValue" (rowClickAction)="rowClick($event)"
      (eventAction)="eventAction($event)" [rowDbClick]="true" (rowDbClickAction)="null"
      [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]">
    </tw-table-component>
  </div>
</div>
