<div class="custom-dialog-box">
    <mat-toolbar class="input-header">
        <div class="header-name">{{"Update Version"|translate}}</div>
        <div class="header-close">
            <button mat-icon-button mat-dialog-close class="close-button ie-close-icon">
                <mat-icon class="icon-style">highlight_off</mat-icon>
            </button>
        </div>
    </mat-toolbar>

    <div class="form-body-large" style="height: 120px;">
        <div class="form-row block-3" style="margin-top: 21px;">
            <div>
                <div class="example-form field-height_2" style="margin-top: 45px;">
                    <mat-label *ngIf="data.tagTypeName == 'ID Card'" class="type_name">{{"ID Card"|translate}}</mat-label>
                    <mat-label *ngIf="data.tagTypeName == 'Coaster'" class="type_name">{{"Coaster"|translate}}</mat-label>
                </div>
            </div>
            <div>
                <div class="example-form" style="margin-top: 30px;">
                    <mat-form-field class="example-full-width form-field" appearance="outline">
                        <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Select Version'|translate">
                            <mat-option>
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </div>
    <div class="ver-input-footer align-foot">
        <button mat-button class="active-btn margin-r-1" style="margin-right: -2% !important;"appDebounceClick
            [debounceTime]="300"
            cdkFocusInitial>{{"Upgrade"|translate}}</button>&nbsp;&nbsp;
        <button mat-button class="cancle-btn" mat-dialog-close>{{"Cancel"|translate}}</button>
    </div>
</div>
