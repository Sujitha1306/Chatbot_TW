<div class="manage-body tw-mat-v2-tab">
    <div class="loading-spinner" *ngIf="isLoading">
        <div class="spinnerload">
            <div class="spin1"></div>
            <div class="spin2"></div>
            <div class="spin3"></div>
        </div>
    </div>
    <div>
        <tw-header-new-component [type]="'new'" [component]="'appterms'" [permission]="null" [dateFilter]="null" [rowFilter]="null"
            [manageAction]="showActions" [selectDropdown]="selectDropdown"
            [selectedName]="selectedName !== null ? selectedName : true" [locationId]="null"
            [selectedView]="selectedView" [multiView]="false" (selectedViewAction)="null"
            (headerEventAction)="headerEventAction($event)" [groupFilter]="groupFilter"></tw-header-new-component>
    </div>
    <div class="tw-content1">
    <mat-tab-group (selectedTabChange)="tabChanged($event)">
        <mat-tab label="{{'Group'|translate}}">
            <ng-template mat-tab-label >{{"Group"|translate}}</ng-template>
            <div *ngIf="tableVersion === 1">
                <tw-table-component [component]="'groups'" [columns]="displayedColumns" [tableData]="tableData"
                    [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="['Code']"
                    (eventAction)="eventAction($event)" [rowId]="'code'" [rowClick]="true"
                    (rowClickAction)="rowClick($event)" [applyFilter]="applyFilterValue"
                    [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'table-with-header'">
                </tw-table-component>
            </div>
            <div *ngIf="tableVersion === 2">
                <tw-data-table [columns]="appTermsTwColumns" [data]="tableData" [pagination]="null"
                    [rowClickable]="true" [rowId]="'code'" (rowClick)="rowClick($event)" (cellAction)="onCellAction($event)"
                    [applyFilter]="applyFilterValue" tableSize="155px" [pagination]="apptermsPaginationConfig">
                </tw-data-table>
            </div>
        </mat-tab>
        <mat-tab label="{{'Appterms'|translate}}">
            <ng-template mat-tab-label >{{"Appterms"|translate}}</ng-template>
            <div *ngIf="tableVersion === 1">
                <tw-table-component [component]="'appterms'" [columns]="displayedColumns2" [tableData]="tableData"
                    [iconHeader]="iconHeader" [iconColumn]="['Status','Default']" [sortColumn]="sortColumn" [eventColumn]="[]"
                    (eventAction)="eventAction($event)" [rowId]="'code'" [rowClick]="true"
                    (rowClickAction)="rowClick($event)" [applyFilter]="applyFilterValue"
                    [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'table-with-header'">
                </tw-table-component>
            </div>
            <div *ngIf="tableVersion === 2">
                <tw-data-table [columns]="appTermsTwColumns2" [data]="tableData" [pagination]="null"
                    [rowClickable]="true" [rowId]="'code'" (rowClick)="rowClick($event)" (cellAction)="onCellAction($event)"
                    [applyFilter]="applyFilterValue" tableSize="155px" [pagination]="apptermsPaginationConfig">
                </tw-data-table>
            </div>
        </mat-tab>
    </mat-tab-group>
    </div>
  </div>
