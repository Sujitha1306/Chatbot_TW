<div class="manage-body">
  <div>
    <tw-header-new-component [component]="'permission'" [permission]="null" [dateFilter]="null" [rowFilter]="null"
      [manageAction]="showActions" [selectDropdown]="selectDropdown"
      [selectedName]="selectedName !== null ? selectedName : true" [locationId]="null" [selectedView]="selectedView"
      [multiView]="false" (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)">
    </tw-header-new-component>
  </div>
  <div class="tw-content1 table-align">
    <tw-table-component [component]="'permission'" [columns]="displayedColumns" [tableData]="tableData"
      [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
      [rowClick]="true" [rowId]="'id'" [rowDbClick]="false" [applyFilter]="applyFilterValue" (rowClickAction)="rowClick($event)"
      (eventAction)="eventAction($event)" [rowDbClick]="true" (rowDbClickAction)="groupMapping($event)"
      [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'table-with-header'">
    </tw-table-component>
  </div>
</div>
