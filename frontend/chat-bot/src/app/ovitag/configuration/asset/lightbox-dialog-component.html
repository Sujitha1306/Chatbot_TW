<div class="input-component-holder ovi-font-family" style="height:100% ;width:100%;overflow: hidden;">
<div class="ovi-pop-hdr">
    <div></div>
    <div mat-dialog-close><mat-icon>highlight_off</mat-icon></div>
</div>
<div  class="ovi-font-family" style="width: 100%; height: 100%; background-color: #000;overflow: auto; display:flex;justify-content:center;align-items:center;">
<div *ngIf="data && data.attachmentId != null">
<img [src]="data.fileUrl" alt="fileUrl" class="clickToEnlarge img-enlg"  *ngIf="data.fileType != 'application/pdf' && data.fileType != 'application/msword' && data.fileType != 'text/plain'">
<object style="width: 100%; height: 100%;" *ngIf="data.fileType == 'application/pdf'" [data]="urlSafe" type="application/pdf">&nbsp;</object>
<object style="width: 100%; height: 100%; background: white;" *ngIf="data.fileType == 'application/msword'" [data]="urlSafe" type="application/pdf">&nbsp;
</object>
<object style="width: 100%; height: 100%; overflow:auto; background: white;" *ngIf="data.fileType == 'text/plain'" [data]="urlSafe" type="application/pdf">&nbsp;
</object>
</div>
<div [style.height]="'100vh'" [style.width]="'100%'" *ngIf="data && data.attachmentId == null">
<img [src]="data.image" alt="" class="clickToEnlarge img-enlg"  *ngIf="data.fileType != 'application/pdf' && data.fileType != 'application/msword' && data.fileType != 'text/plain'">
<object style="width: 100%; height: 100%;" *ngIf="data.fileType == 'application/pdf'" [data]="urlSafe" type="application/pdf">&nbsp;</object>
<pre  style="width: 100%;height: 100%;background-color:white;overflow:auto"*ngIf="data.fileType == 'text/plain'" >{{data.image}}</pre>
<div style="height: 100%;width:100%; text-align: center; background-color: white;" *ngIf="data.fileType == 'application/msword'"> {{"Please click download to preview."|translate}}
    <button mat-button style="background:#317eed; color: white; margin-left: 10px; margin-top: 215px;" (click)="downloadPreview();">{{"Download"|translate}}</button>
</div>
</div>
<object style="width: 100%; height: 100%;" *ngIf="isDownload" [data]="data.image" type="application/pdf">&nbsp;
</object>
</div>
</div>
