<div class="loading-spinner" *ngIf="isloading">
    <div class="spinnerload">
        <div class="spin1"></div>
        <div class="spin2"></div>
        <div class="spin3"></div>
    </div>
</div>
<div class="manage-body">
    <div>
        <tw-header-new-component  [component]="'set-resource'" [permission]="null" [dateFilter]="null" [rowFilter]="null"
            [manageAction]="showActions" [selectDropdown]="selectDropdown"
            [selectedName]="selectedName !== null ? selectedName : true" [locationId]="null"
            [selectedView]="selectedView" [multiView]="false" (selectedViewAction)="null"
            (headerEventAction)="headerEventAction($event)"></tw-header-new-component>
    </div>
    <mat-tab-group  (selectedTabChange)="tabChanged($event)">
        <mat-tab label="{{'Surgicals Set'|translate}}">
            <div>
                <tw-table-component [component]="'set-resource'" [columns]="displayedColumns" [tableData]="tableData"
                    [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
                    [rowClick]="false" [rowId]="'id'" (rowClickAction)="rowClick($event)" (eventAction)="eventAction($event)" 
                    [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableClass]="'tab-table'">
                </tw-table-component>
            </div>
        </mat-tab>
        <mat-tab label="{{'CSSD Resquest'|translate}}">
            <div>
                <tw-table-component [component]="'cssd-request'" [columns]="CRdisplayedColumns" [tableData]="cssdTableData"
                [iconHeader]="CRiconHeader" [iconColumn]="CRiconColumn" [sortColumn]="CRsortColumn" [eventColumn]="[]"
                [rowClick]="false" [rowId]="'id'" (rowClickAction)="rowClick($event)" (eventAction)="eventAction($event)" 
                [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'tab-table'">
            </tw-table-component>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
