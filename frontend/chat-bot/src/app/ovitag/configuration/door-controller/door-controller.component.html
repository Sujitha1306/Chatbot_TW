<div>
    <mat-tab-group [selectedIndex]="selectedTabIndex" (selectedTabChange)="tabChanged($event)">
        <mat-tab label="'Door Controller'" style="overflow-y: auto;">
            <ng-template mat-tab-label>{{ 'Door Controller' | translate }}</ng-template>
            <tw-header-new-component [type]="'new'" [component]="'door-controller'" [permission]="null" [dateFilter]="null"
                [rowFilter]="null" [manageAction]="showActions" [selectDropdown]="selectDropdown"
                [selectedName]="selectedName !== null ? selectedName : null" [locationId]="null" [selectedView]="null"
                (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)" [groupFilter]="parentFilter"
                [enableCloseButton]="enableCloseButton"></tw-header-new-component>
            <div>
                <tw-table-component [component]="'door-controller'" [columns]="displayedColumns" [tableData]="tableData"
                    [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [rowId]="'Id'"
                    [rowClick]="true" (checkBoxAction)="checkBoxAction($event)" [eventColumn]="eventColumn"
                    (eventAction)="eventAction($event)" [applyFilter]="applyFilterValue"
                    [permissionControl]="permissionControl" [pagination]="null" [dateTimeColumns]="dateTimeColumns"
                    [tableClass]="'table-icon-header'"></tw-table-component>
            </div>
        </mat-tab>
        <mat-tab label="Health Watch" style="overflow-y: auto;">
            <ng-template mat-tab-label>{{ 'Geofence Health Watch' | translate }}</ng-template>
            <tw-header-new-component [type]="'new'" [component]="'geofenceHealthWatch'" [permission]="null"
                [dateFilter]="null" [rowFilter]="null" [manageAction]="null" [selectDropdown]="null" [selectedName]="null"
                [locationId]="null" [selectedView]="null" (selectedViewAction)="null"
                (headerEventAction)="headerGeofenceEvent($event)" [groupFilter]="[]"
                [enableCloseButton]="false"></tw-header-new-component>
            <div>
                <tw-table-component [component]="'geofenceHealthWatch'" [columns]="geofenceColumns"
                    [tableData]="geofenceTableData" [iconHeader]="[]" [iconColumn]="[]" [sortColumn]="[]"
                    [eventColumn]="geofenceeventColumn" (eventAction)="geofenceEventAction($event)" [dateTimeColumns]="dateTimeColumns"
                    [permissionControl]="[null]" [pagination]="null"
                    [tableClass]="'table-icon-header'"></tw-table-component>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
