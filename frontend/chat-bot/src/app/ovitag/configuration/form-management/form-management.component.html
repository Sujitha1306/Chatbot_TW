<div class="loading-spinner" *ngIf="isLoading">
  <div class="spinnerload">
      <div class="spin1"></div>
      <div class="spin2"></div>
      <div class="spin3"></div>
  </div>
</div>
<div class="manage-body">
    <div>
        <tw-header-new-component [component]="'formManagement'" [type]="'new'" [permission]="null" [dateFilter]="null" 
            [selectFilter]="selectFilter" [manageAction]="showActions" [selectDropdown]="selectDropdown"
            [selectedName]="selectedName !== null ? selectedName : true" [locationId]="'All'"
            [selectedView]="null" [multiView]="false" (selectedViewAction)="null"
            (headerEventAction)="headerEventAction($event)" [groupFilter]="parentFilter"></tw-header-new-component>
    </div>
    <div>
        <tw-table-component [component]="'form'" [columns]="displayedColumns" [tableData]="tableData"
            [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="['Name']" (eventAction)="eventAction($event)"
            [rowId]="'id'" [rowDbClick]="false" (rowDbClickAction)="rowClick($event)" [applyFilter]="applyFilterValue" [dateTimeColumns]="dateTimeColumns"
            [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize , pageStart: pageStart}]" [tableClass]="'table-icon-header'" [enableSlicing]="true" [enableScroll]="true">
        </tw-table-component>
    </div>
</div>
