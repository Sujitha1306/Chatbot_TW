<div fxFlex class="input-component-holder">
        <mat-toolbar class="input-header">
                <div class="header-name" *ngIf ="!data.id">{{"Create Rule"|translate}}</div>
                <div class="header-name" *ngIf ="data.id">{{"Modify Rule"|translate}}</div>
                <div class="header-close"><button mat-icon-button mat-dialog-close close-button class="ie-close-icon">
                    <mat-icon class="icon-style">highlight_off</mat-icon></button></div> 
        </mat-toolbar>
        <div class="input-container" [formGroup]="ruleForm">
            <div class="form_body">
                <div class="form-row"><h2>{{"Rule Information"|translate}}</h2></div>
                <div class="form-row block-3">
                    <div class="row-field-5" *ngIf = "data.id">
                        <div class="example-form">
                            <mat-form-field class="example-full-width form-field">
                                <input matInput appPlaceholder [showPlaceholder]="true" [placeholderText]="'ID'|translate"  [(value)]="data.id" disabled >
                            </mat-form-field>
                        </div> 
                    </div>
                    <div class="row-field-5">
                        <div class="example-form">
                            <mat-form-field class="example-full-width form-field">
                                <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Scope*'|translate"  formControlName = "ruleScopeId" >
                                    <mat-option *ngFor="let scope of ruleScope" [value]="scope.code">
                                        {{scope.value}}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="ruleForm.controls.ruleScopeId.invalid">
                                    <span [hidden]="!ruleForm.controls['ruleScopeId'].errors.required">{{"Scope is required."|translate}}</span>
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>
               
                    <div class="row-field-5">
                        <div class="example-form">
                            <mat-form-field class="example-full-width form-field">
                                <input matInput appPlaceholder [showPlaceholder]="true" [placeholderText]="'Name'|translate"  formControlName = "name">
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row-field-5" >
                        <div class="example-form">
                            <mat-form-field class="example-full-width form-field">
                                <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Care Setting*'|translate"  formControlName = "careSettingId" >
                                    <mat-option *ngFor="let care of careSetting" [value]="care.code">
                                        {{care.value}}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="ruleForm.controls.careSettingId.invalid">
                                    <span [hidden]="!ruleForm.controls['careSettingId'].errors.required">{{"Care setting is required."|translate}}</span>
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>
                
                    <div class="row-field-5" >
                        <div class="example-form">
                            <mat-form-field class="example-full-width form-field">
                                <mat-select appPlaceholder [showPlaceholder]="true" [placeholderText]="'Type*'|translate"  formControlName = "ruleTypeId" >
                                    <mat-option *ngFor="let type of ruleType" [value]="type.code">
                                        {{type.value}}
                                    </mat-option>
                                </mat-select>
                                <mat-error *ngIf="ruleForm.controls.ruleTypeId.invalid">
                                    <span [hidden]="!ruleForm.controls['ruleTypeId'].errors.required">{{"Type is required."|translate}}</span>
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="row-field-5">
                        <div class="example-form">
                            <mat-form-field class="example-full-width form-field">
                                <textarea matInput appPlaceholder [showPlaceholder]="true" [placeholderText]="'Description'|translate"  rows = 1 formControlName="description"></textarea>
                            </mat-form-field>
                        </div>
                    </div>
                </div>
            </div>
        
            <div class="input-footer">
                <button mat-button class="cancle-btn" mat-dialog-close>{{"Cancel"|translate}}</button>
                <button mat-button *ngIf ="!data.id" class="active-btn margin-r-1" appDebounceClick [disabled]="ruleForm.invalid || isDisabled" 
                 (debounceClick)="saveRule()" [debounceTime]="300" cdkFocusInitial>{{"Create"|translate}}</button>
                <button mat-button *ngIf ="data.id" class="active-btn margin-r-1" appDebounceClick [disabled]="ruleForm.invalid || isDisabled" 
                 (debounceClick)="updateRule(data.id)" [debounceTime]="300" cdkFocusInitial>{{"Save"|translate}}</button>
            </div>
        </div>
    </div>
