<div class="manage-body container-fluid">
   <div class="loading-spinner" *ngIf="isLoading">
      <div class="spinnerload">
          <div class="spin1"></div>
          <div class="spin2"></div>
          <div class="spin3"></div>
      </div>
    </div> 
  <tw-header-new-component [type]="'new'" [component]="'package'" [permission]="null" [dateFilter]="null" [rowFilter]="null" [manageAction]="showActions" [selectDropdown]="selectDropdown" [selectedName]="selectedName !== null ? selectedName : true"
  [locationId]="null" [selectedView]="selectedView" [multiView]="false" (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)"  [groupFilter]="parentFilter"></tw-header-new-component>
  <div>
    <tw-table-component [component]="'package'" [columns]="displayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn"
      [eventColumn]="[null]" [rowId]="'id'" [rowClick]="true" (rowClickAction)="rowClick($event)"
      [rowDbClick]="true" (rowDbClickAction)="createPackage($event)" [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" (eventAction)="eventAction($event)" [tableClass]="'table-icon-header'"></tw-table-component>
  </div>
</div>
