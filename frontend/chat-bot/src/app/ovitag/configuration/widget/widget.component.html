<div class="loading-spinner" *ngIf="isLoading">
  <div class="spinnerload">
      <div class="spin1"></div>
      <div class="spin2"></div>
      <div class="spin3"></div>
  </div>
</div>
<div>
    <tw-header-new-component [component]="'widget'" 
        [permission]="null" [dateFilter]="null" [rowFilter]="null" 
        [manageAction]="showActions" [selectDropdown]="selectDropdown" 
        [selectedName]="selectedName !== null ? selectedName : true"
        [locationId]="null" [selectedView]="null" [multiView]="false"
        (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)">
    </tw-header-new-component>
</div>
<div>
    <tw-table-component [component]="'widget'" 
        [columns]="displayedColumns" [tableData]="tableData"
        [iconHeader]="iconHeader" [iconColumn]="iconColumn"
        [sortColumn]="sortColumn" [eventColumn]="['Name','Action']" (eventAction)="eventAction($event)"
        [rowClick]="true" (rowClickAction)="rowClick($event)" [rowId]="'id'" [rowDbClick]="false" (rowDbClickAction)="createWidget($event)"
        [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [tableClass]="'table-with-header'" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [enableScroll]="false">
    </tw-table-component>
</div>
