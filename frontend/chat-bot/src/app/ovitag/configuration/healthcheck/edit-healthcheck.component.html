<div fxFlex class="input-component-holder">
    <mat-toolbar class="input-header">
        <div class="header-name">{{"Edit Location"|translate}}</div>
        <div class="header-close"><button mat-icon-button mat-dialog-close close-button class="ie-close-icon">
                <mat-icon class="icon-style">highlight_off</mat-icon>
            </button></div>
    </mat-toolbar>
    <div class="input-container" [formGroup]="healthcheckForm">
        <div class="form_body">
            <div class="form-row">
                <h2>&nbsp;</h2>
            </div>

            <div class="form-row block-3">
                <div class="row-field-5">
                    <div class="example-form">
                        <mat-label class="ovi-lbl-text-size">{{"Status"|translate}}</mat-label>
                        <mat-form-field class="example-full-width form-field" appearance="outline">
                            <mat-select formControlName="statusName"[disableOptionCentering]="true">
                                <mat-option *ngFor="let data of statustypes" [value]="data.code">{{data.value}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <div class="row-field-5">
                    <div class="example-form">
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="ovi-popup-title-text-size top-styl">{{"LOCATION DETAILS"|translate}}</div>
            </div>
            <mat-divider class="divider"></mat-divider>
            <div class="form-row block-3">
                <div class="row-field-5">
                    <div class="example-form">
                        <mat-label class="ovi-lbl-text-size">{{"Test Name"|translate}}</mat-label>
                        <mat-form-field class="example-full-width form-field" appearance="outline">
                            <input matInput appPlaceholder [showPlaceholder]="false" [placeholderText]="'Test Name'|translate" formControlName="healthPlanName"
                                autocomplete="off">
                        </mat-form-field>
                    </div>
                </div>
                <div class="row-field-5">
                    <div class="example-form">
                        <mat-label class="ovi-lbl-text-size"> {{"Queue Length"|translate}}</mat-label>
                        <mat-form-field class="example-full-width form-field" appearance="outline">
                            <input matInput appPlaceholder [showPlaceholder]="false" [placeholderText]="'Queue Length'|translate" formControlName="capacity"
                                autocomplete="off">
                        </mat-form-field>
                    </div>
                </div>
            </div>

        </div>
        <div class="input-footer ovi-font-family">
            <button mat-button mat-dialog-close class="can-btn">{{"CANCEL"|translate}}</button>
            <button mat-button class="active-btn margin-r-1" [disabled]="healthcheckForm.invalid || isDisabled"
            cdkFocusInitial>{{"SAVE"|translate}}</button>
        </div>
    </div>
</div>
