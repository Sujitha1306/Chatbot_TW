<lazy-loader *ngIf=loading()></lazy-loader>
<div class="ovi-font-family">
    <div class="ovi-pop-hdr">
        <div *ngIf="data?.type !== 'AssetMaintenance'"> 
            <span>Print Sticker</span>
        </div>
        <div *ngIf="data?.type === 'AssetMaintenance'"> 
            <span> Asset Maintenance <span class="ovi-fnt-sze13">(Print Sticker)</span></span>
        </div>
        <div mat-dialog-close><mat-icon>highlight_off</mat-icon></div>
    </div>
    <div style="padding: 0 5px;">
        <tw-header-new-component [type]="'new'" [component]="'print-sticker'" [permission]="null" [dateFilter]="selectedDate"
        [toDateFilter]="null" [rowFilter]="null" [manageAction]="null" [selectDropdown]="null"
        [selectedName]="true" [selectedView]="null" [multiDateEnable]="false" [multiView]="false"
        (selectedViewAction)="null" [groupFilter]="groupFilter" [isDateClear]="false"
        (headerEventAction)="headerEventAction($event)"></tw-header-new-component>
    <div>
        <div style="display: flex;justify-content: flex-end;">
            <div *ngIf="selectedStickerData.length > 1 && data?.type === 'AssetMaintenance' && false" style="display: flex;justify-content: flex-end;padding: 3px 5px;">
                <button mat-button class="print-btn" (click)="onAssignToAll(selectedStickerData)">
                    <mat-icon class="ovi-fnt-sze16" style="width:fit-content;height:fit-content;padding:0;padding-bottom:3px;padding-right:2px;">
                        assignment_ind</mat-icon>Assign All
                </button>
            </div>
            <div *ngIf="selectedStickerData.length > 1" style="display: flex;justify-content: flex-end;padding: 3px 5px;">
                <button mat-button class="print-btn" [disabled]="isPrintDisabled()"(click)="printAll(selectedStickerData)">
                    <mat-icon class="ovi-fnt-sze16" style="width:fit-content;height:fit-content;padding:0;padding-bottom:3px;padding-right:2px;">
                        print</mat-icon>Print All
                </button>
            </div>
        </div>
        <tw-table-component [component]="'print-sticker'" [columns]="displayedColumns" [tableData]="tableData"
            [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
            (eventAction)="eventAction($event)" [applyFilter]="applyFilterValue" [rowClick]="true" [rowId]="'requestId'"
            (rowClickAction)="rowClick($event)" [permissionControl]="permissionControl" [dateColumns]="dateColumns"
            (checkBoxAction)="checkBoxAction($event)" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableSize]="'130px'">
        </tw-table-component>
    </div>
    </div>
</div>
