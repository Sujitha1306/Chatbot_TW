<div class="manage-body">
  <tw-header-new-component [component]="'item-master'" [permission]="null" [dateFilter]="null" [rowFilter]="null"
    [manageAction]="showActions" [selectDropdown]="selectDropdown"
    [selectedName]="selectedName !== null ? selectedName : true" [locationId]="null" [selectedView]="selectedView"
    [multiView]="false" (selectedViewAction)="null"
    (headerEventAction)="headerEventAction($event)"></tw-header-new-component>
  <div>
    <tw-table-component [component]="'item-master'" [columns]="displayedColumns" [tableData]="tableData"
      [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
      (rowClickAction)="rowClick($event)" [rowClick]="true" [rowId]="'id'" (eventAction)="eventAction($event)"
      [rowDbClick]="true" (rowDbClickAction)="createItems($event)" [applyFilter]="applyFilterValue" [permissionControl]="permissionControl"
       [pagination]="null" [tableClass]="'table-with-header'"></tw-table-component>
  </div>
</div>
