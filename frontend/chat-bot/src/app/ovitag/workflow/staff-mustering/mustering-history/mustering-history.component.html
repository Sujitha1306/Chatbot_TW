<div class="input-component-holder ovi-font-family" style="height:100% ;width:100%;">
<div class="ovi-pop-hdr">
        <div style="margin-left: 10px;">{{drillName|translate}}</div>
        <div mat-dialog-close><mat-icon>highlight_off</mat-icon></div>
</div>
<div>
     <div class="card-container">
              <div class="card" *ngFor="let item of dashboardData">
                <div class="card-label">{{ item.label }}</div>
                <div class="card-value">{{ item.value }}</div>
              </div>
            </div>
      <tw-header-new-component [type]="'new'" [component]="'musteringHistory'" [permission]="null" [dateFilter]="null" [rowFilter]="null" [selectDropdown]="null" [selectedName]="null"
        [locationId]="null" [selectedView]="null"  (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)" [groupFilter]="[]" ></tw-header-new-component> 
      <angular-table-component 
                [id]="'musteringHistory'" 
                [type]="'ng-table'" 
                [tableData]="tableData"
                [columns]="['Name','From Location','To Location','Time']"
                [columnData]="['inchargeName','srcLocationName','locationName','scheduleTime']"
                (triggerAction)="null" [applyFilter]="applyFilterValue">
      </angular-table-component>
</div>
</div>
