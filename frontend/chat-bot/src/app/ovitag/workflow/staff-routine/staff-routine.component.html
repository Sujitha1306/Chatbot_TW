<div class="manage-body" *ngIf="showTable">

  <tw-header-new-component [component]="'staffRoutine'" [permission]="null" [dateFilter]="null" [rowFilter]="rowFilter" [manageAction]="showActions" [selectDropdown]="selectDropdown" [selectFilter]="selectFilter"
   [selectedName]="selectedName !== null ? selectedName : true" [locationId]="'null'" [selectedView]="null" [multiView]="false" (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)"></tw-header-new-component>

  <div *ngIf="selectedView == 'table'">
    <tw-table-component [component]="'staffRoutine'" [columns]="displayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn"
      [eventColumn]="eventColumn" (eventAction)="eventAction($event)" [rowClick]="true" [rowId]="'userId'" (rowClickAction)="rowClick($event)" [timeColumns]="timeColumns"
      [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableClass]="'table-with-header'"></tw-table-component>
  </div>
</div>
