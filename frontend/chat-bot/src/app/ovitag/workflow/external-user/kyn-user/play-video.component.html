<div class="input-component-holder container-fluid" style="height: 100%;width: 100%;background: #818181;">
        <div class="video-close">
            <button mat-icon-button mat-dialog-close close-button class="ie-close-icon" style="padding: 3px;">
                <mat-icon class="icon-style" style="width: 32px;">highlight_off</mat-icon>
            </button>
        </div>
    <div style="width: 100%; height: 100%;" *ngIf ="data.hasOwnProperty('sourceUrl') && data.sourceUrl !== null">
    <video controls style="height: 100%; width: 100%; object-fit: contain;" autoplay>
        <source [src]="data.sourceUrl" type="video/mp4">
    </video>
    </div>
    <div *ngIf ="!data.hasOwnProperty('sourceUrl')" style="width: 100%; height: 100%;">
        <img style="height: 100%; width: 100%; object-fit: contain;" [src]="data.thumbnailUrl" alt="pic">
    </div>
</div>
