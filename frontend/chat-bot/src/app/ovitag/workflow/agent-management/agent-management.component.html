<div class="manage-body">
  <div class="ot-tab-content" style="height: 100%;">
    <tw-header-new-component [component]="'agent-management'" [permission]="null" [dateFilter]="null"
      [selectFilter]="selectFilter" [rowFilter]="rowfilter" [manageAction]="showActions" [selectDropdown]="null"
      [selectedName]="true" [locationId]="locationId" [selectedView]="'table'" [multiView]="false"
      (selectedViewAction)="null" (headerEventAction)="headerEventAction($event)">
    </tw-header-new-component>
    <div fxLayout="column" class="mat-elevation-z4 manage-component" [ngClass.xs]="'components-container-xs'"
      fxLayoutGap="5px" style="height:calc(100% - 120px);">
      <div class="mat-table-overflow" style="height: 100%;width: 100%;">
        <mat-table #table [dataSource]="dataSource" matSort style="height: calc(100% - 70px); overflow: auto;">
          <ng-container *ngFor="let col of displayedData" matColumnDef="{{col.colName}}">
            <mat-header-cell *matHeaderCellDef mat-sort-header class="manage-table-header"
              style="justify-content: flex-start;"> {{col.title}} </mat-header-cell>
            <mat-cell *matCellDef="let element">
              <span *ngIf="col.colName != 'name'" (click)="createAgent(element)" (keydown.enter)="fixClick()">{{element[col.dataName]}}</span>
              <span *ngIf="col.colName == 'name'" (click)="createAgent(element)" (keydown.enter)="fixClick()"
                style="color: blue; cursor: pointer;">{{element[col.dataName]}}</span>
            </mat-cell>
          </ng-container>
          <mat-header-row *matHeaderRowDef="displayedColumns" class="manage-table-header-row"
            style="min-height: 40px;height: 40px !important;"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;" class="element-row"
            style="min-height: 40px;height: 40px !important;" (toggleChange)="onToggleChange($event,row)">
          </mat-row>
        </mat-table>
        <mat-paginator [pageSizeOptions]="[10, 15, 20, 50, 100]" showFirstLastButtons></mat-paginator>
      </div>
    </div>
  </div>
</div>
