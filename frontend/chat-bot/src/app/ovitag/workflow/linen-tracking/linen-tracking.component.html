<lazy-loader *ngIf=loading></lazy-loader>
<div class="manage-body">
    <tw-header-new-component [component]="'linen-track'" [permission]="null" [dateFilter]="null" 
        [manageAction]="showActions" [selectDropdown]="selectDropdown" [selectedName]="true" [locationId]="null"
        [selectedView]="null" [multiView]="false" (selectedViewAction)="null"  [selectFilter]="selectFilter" [rowFilter]="rowFilter" [selectTypeFilter]="selectTypeFilter" [rowTypeFilter]="rowTypeFilter"
        (headerEventAction)="headerEventAction($event)"></tw-header-new-component>
    <div *ngIf="selectedView == 'table'" class="tw-content1">
        <mat-tab-group [selectedIndex]="selectedTabIndex" (selectedTabChange)="tabChanged($event)">
            <mat-tab label="{{'Manage Linen'|translate}}">
                <ng-template mat-tab-label >{{"Manage Linen"|translate}}</ng-template>
                <tw-table-component [component]="'manage-amb'" [columns]="MTDisplayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="[]" [sortColumn]="sortColumn"
                  [eventColumn]="[]" (eventAction)="eventAction($event)" [rowClick]="true" [rowId]="'assetId'" (rowClickAction)="rowClick($event)" [dateTimeColumns]="dateTimeColumns"
                  [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
            <mat-tab label="{{'Storage'|translate}}">
                <ng-template mat-tab-label >{{"Storage"|translate}}</ng-template>
                <tw-table-component [component]="'manage-amb'" [columns]="MTDisplayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="[]" [sortColumn]="sortColumn"
                  [eventColumn]="[]" (eventAction)="eventAction($event)" [rowClick]="true" [rowId]="'assetId'" (rowClickAction)="rowClick($event)" [dateTimeColumns]="dateTimeColumns"
                  [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
            <mat-tab label="{{'Distribution'|translate}}">
                <ng-template mat-tab-label >{{"Distribution"|translate}}</ng-template>
                <tw-table-component [component]="'manage-amb'" [columns]="MTDisplayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="[]" [sortColumn]="sortColumn"
                  [eventColumn]="[]" (eventAction)="eventAction($event)" [rowClick]="true" [rowId]="'assetId'" (rowClickAction)="rowClick($event)" [dateTimeColumns]="dateTimeColumns"
                  [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
            <mat-tab label="{{'Collection'|translate}}">
                <ng-template mat-tab-label >{{"Collection"|translate}}</ng-template>
                <tw-table-component [component]="'manage-amb'" [columns]="MTDisplayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="[]" [sortColumn]="sortColumn"
                  [eventColumn]="[]" (eventAction)="eventAction($event)" [rowClick]="true" [rowId]="'assetId'" (rowClickAction)="rowClick($event)" [dateTimeColumns]="dateTimeColumns"
                  [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>  
            <mat-tab label="{{'Laundary'|translate}}">
                <ng-template mat-tab-label >{{"Laundary"|translate}}</ng-template>
                <tw-table-component [component]="'manage-amb'" [columns]="MTDisplayedColumns" [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="[]" [sortColumn]="sortColumn"
                  [eventColumn]="[]" (eventAction)="eventAction($event)" [rowClick]="true" [rowId]="'assetId'" (rowClickAction)="rowClick($event)" [dateTimeColumns]="dateTimeColumns"
                  [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="null" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
        </mat-tab-group>
    </div>
</div>
