<lazy-loader *ngIf=loading></lazy-loader>
<div>
    <div>
        <tw-header-new-component [type]="'new'" [component]="'task'" [permission]="null" [dateFilter]="null" [rowFilter]="null"
        [manageAction]="showActions" [selectDropdown]="null" [selectedName]="true" [selectedView]="null"
        [multiView]="false" (selectedViewAction)="null" [groupFilter]="groupFilter" [isDateClear]="false"
        (headerEventAction)="headerEventAction($event)"></tw-header-new-component>
    </div>
    <div>
        <mat-tab-group (selectedTabChange)="tabChanged($event)">
            <mat-tab *ngIf="activate_btn && activate_btn.includes('BT_RM_PAT')"  label="{{'Patient'|translate}}">
                <tw-table-component [component]="'manageRoutine'" [columns]="displayedColumns" [tableData]="tableData"
                [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
                (eventAction)="eventAction($event)" [rowClick]="false" [rowId]="'id'" [dateColumns]="dateColumns" [timeColumns] = "timeColumns"
                [applyFilter]="applyFilterValue" [rowDbClick]="true" 
                 [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
            <mat-tab *ngIf="activate_btn && activate_btn.includes('BT_RM_AST')" label="{{'Asset'|translate}}">
                <tw-table-component [component]="'manageRoutine'" [columns]="displayedColumns" [tableData]="tableData" [dateColumns]="dateColumns" [timeColumns] = "timeColumns"
                [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
                (eventAction)="eventAction($event)" [rowClick]="false" [rowId]="'id'" 
                [applyFilter]="applyFilterValue" [rowDbClick]="true" 
                [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
            <mat-tab *ngIf="activate_btn && activate_btn.includes('BT_RM_LOC')" label="{{'Location'|translate}}">
                <tw-table-component [component]="'manageRoutine'" [columns]="displayedColumns" [tableData]="tableData" [dateColumns]="dateColumns" [timeColumns] = "timeColumns"
                [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
                (eventAction)="eventAction($event)" [rowClick]="false" [rowId]="'id'" 
                [applyFilter]="applyFilterValue" [rowDbClick]="true" 
                [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
            <mat-tab *ngIf="activate_btn && activate_btn.includes('BT_RM_STF')" label="{{'Staff'|translate}}">
                <tw-table-component [component]="'manageRoutine'" [columns]="displayedColumns" [tableData]="tableData" [dateColumns]="dateColumns" [timeColumns] = "timeColumns"
                [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
                (eventAction)="eventAction($event)" [rowClick]="false" [rowId]="'id'" 
                [applyFilter]="applyFilterValue" [rowDbClick]="true" 
                [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
            <mat-tab *ngIf="activate_btn && activate_btn.includes('BT_RM_PRD')" label="{{'Production'|translate}}">
                <tw-table-component [component]="'manageRoutine'" [columns]="displayedColumns" [tableData]="tableData" [dateColumns]="dateColumns" [timeColumns] = "timeColumns"
                [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
                (eventAction)="eventAction($event)" [rowClick]="false" [rowId]="'id'" 
                [applyFilter]="applyFilterValue" [rowDbClick]="true" 
                [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableClass]="'tab-table'"></tw-table-component>
            </mat-tab>
        </mat-tab-group>
    </div>
</div>
