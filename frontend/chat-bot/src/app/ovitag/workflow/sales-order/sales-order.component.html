<div class="loading-spinner" *ngIf="isloading">
    <div class="spinnerload">
        <div class="spin1"></div>
        <div class="spin2"></div>
        <div class="spin3"></div>
    </div>
</div>
<div class="manage-body">
    <div>
        <tw-header-new-component [type]="'new'" [component]="'sales-order'" [permission]="null" [dateFilter]="null" [toDateFilter]="null"
            [manageAction]="showActions" [selectDropdown]="selectDropdown" [groupFilter]="[]" [multiDateEnable]="false"
            [selectedName]="selectedName !== null ? selectedName : true" [selectedView]="null" [multiView]="false" (selectedViewAction)="null"
            (headerEventAction)="headerEventAction($event)"></tw-header-new-component>
    </div>
    <div>
        <tw-table-component [component]="'sales-order'" [columns]="displayedColumns" [tableData]="tableData" [dateTimeColumns]="dateTimeColumns"
            [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
            [rowId]="'id'" [rowClick]="true" (rowClickAction)="rowClick($event)" (eventAction)="eventAction($event)"
            [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [tableClass]="'table-with-header'"
            [pagination]="null" [rowDbClick]="true"
            (rowDbClickAction)="createSaleOrder($event)" >
        </tw-table-component>
    </div>
</div>
