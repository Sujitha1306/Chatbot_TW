<div class="input-component-holder ovi-font-family" style="height:100% ;width:100%;">
    <div class="ovi-pop-hdr">
        <div>{{"Create Form"|translate}}</div>
        <div mat-dialog-close><mat-icon>highlight_off</mat-icon></div>
    </div>

   <div class="ovi-matfrmfld ovi-matfrmfld-box-top-btm-pdg popup-margin" style="overflow: auto;height:calc(100% - 140px);">
        <div  [formGroup]="forms">
            <div class="ovi-row-gap">
                <div class="ovi-row-three-clmn ovi-matfrmfld-drpdwn-top-box">
                        <mat-label class="ovi-lbl-text-size"> {{"Form Type"|translate}} </mat-label>
                        <mat-form-field class="ovi-row-frmfld-wdh" appearance="outline">
                            <mat-select  appPlaceholder [showPlaceholder]="false" [placeholderText]="'Form Type'|translate"
                                 formControlName="formTypeId">
                                <mat-option [value]="'All'">All</mat-option>
                                <mat-option *ngFor="let type of formTemplateTypeList" [value]="type.code">
                                    {{type.value}}</mat-option>
                            </mat-select>
                        </mat-form-field>
                </div>
                <div class="ovi-row-three-clmn ovi-matfrmfld-drpdwn-top-box">
                        <mat-label class="ovi-lbl-text-size"> {{"Form Select"|translate}}</mat-label>
                        <mat-form-field class="ovi-row-frmfld-wdh" appearance="outline">
                            <mat-select  appPlaceholder [showPlaceholder]="false" [placeholderText]="'Form Select'|translate" formControlName="formSelectId">
                                <mat-option *ngFor="let form of formTemplate" [value]="form.id">
                                    {{form.name}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                </div>
                <div class="ovi-row-three-clmn" style="position: relative;align-content: center;">
                        <button mat-button *ngIf="forms.controls['formSelectId'].value !== null"
                            class="active-btn" appDebounceClick (debounceClick)="formBuilder(null);"
                            [debounceTime]="300" cdkFocusInitial>{{"Add"|translate}}</button>
                </div>
            </div>
        </div>
    </div>
</div>
