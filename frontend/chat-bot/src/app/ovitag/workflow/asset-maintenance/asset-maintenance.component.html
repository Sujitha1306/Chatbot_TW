<lazy-loader *ngIf=loading()></lazy-loader>

<div class="manage-body">
    <tw-header-new-component [type]="'new'" [component]="'asset-maintenance'" [permission]="null"
        [dateFilter]="selectedView === 'table' ? selectedDate : null" [toDateFilter]="selectedView === 'table' ? selectedToDate : null" [multiDateEnable]="true" [dateType]="isDateType" [rowFilter]="null" [manageAction]="showActions" [selectDropdown]="selectDropdown"
        [selectedName]="selectedName.length ? selectedName : true" [selectedView]="selectedView" [multiView]="enableMultiView" [view]="ipView"
        [multiView]="true" (selectedViewAction)="selectedViewAction($event)" [groupFilter]="parentFilter" [multiYear]="true" [excel]="true"
        (headerEventAction)="headerEventAction($event)"></tw-header-new-component>

    <div *ngIf="selectedView === 'table'">
        <tw-table-component [component]="'asset-maintenance'" [columns]="displayedColumns" [tableData]="tableData"
            [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn" [eventColumn]="eventColumn"
            (eventAction)="eventAction($event)" [rowClick]="true" [rowId]="'id'" [applyFilter]="applyFilterValue" [permissionControl]="permissionControl" [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" 
            [tableSize]="'134px'" (checkBoxAction)="checkBoxAction($event)" [fixedColumns]="fixedColumns"></tw-table-component>
    </div>

    <div *ngIf="selectedView === 'calendarView'">
        <app-calendar [calendarInput]="calendarData" (calendarUpdatedData)="calendarUpdatedData($event)"></app-calendar>
    </div>
</div>
