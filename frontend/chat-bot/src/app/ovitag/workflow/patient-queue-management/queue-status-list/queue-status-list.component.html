<div class="patient-Q-list-container">
  <button mat-icon-button [matMenuTriggerFor]="statusMenu" class="patient-Q-btn" (menuOpened)="onMenuToggle(true)"
    (menuClosed)="onMenuToggle(false)">
    <i class="material-icons ovi-fnt-sze18" style="padding: 0; margin-top: -26px; height: fit-content; width: fit-content;">more_vert</i>
  </button>
</div>
<mat-menu class="option" #statusMenu="matMenu">
  <ng-template [matMenuContent]>
    <ng-container *ngIf="!dynamicConfig">
      <button mat-menu-item *ngIf="currentStatus != 'QS-PE' && currentStatus != 'QS-PC'"
        (click)="changeStatus(queueId,'QS-PE')">
        <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="15px" alt="">
        &nbsp; Pending
      </button>

      <button mat-menu-item *ngIf="currentStatus != 'QS-WT' && currentStatus != 'QS-CO'"
        (click)="changeStatus(queueId,'QS-WT')">
        <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
        &nbsp; {{ currentStatus != 'QS-PC' ? 'Waiting' : 'Add to Queue' }}
      </button>

      <button mat-menu-item
        *ngIf="!locationPending && currentStatus != 'QS-IP' && currentStatus != 'QS-PC' && currentStatus != 'QS-CO'"
        (click)="changeStatus(queueId,'QS-IP')">
        <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
        &nbsp; Inprogress
      </button>

      <button mat-menu-item *ngIf="currentStatus == 'QS-IP'" (click)="changeStatus(queueId,'QS-CO')">
        <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
        &nbsp; Complete
      </button>

      <button mat-menu-item *ngIf="currentStatus == 'QS-IP'" (click)="changeStatus(queueId,'QS-CO', 'remarks')">
        <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
        &nbsp; Complete with Remarks
      </button>

      <button mat-menu-item *ngIf="currentStatus == 'QS-IP'" (click)="changeStatus(queueId,'QS-CO', 'review')">
        <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
        &nbsp; Complete with Review
      </button>
    </ng-container>

     <ng-container *ngIf="dynamicConfig">
      <ng-container *ngIf="currentStatus == 'QS-IP'">
        <ng-container *ngFor="let data of Inprogressmenu">
          <button mat-menu-item *ngIf="data.value !== 'CompleteRemarks' && data.value !== 'CompleteReview'"
                  (click)="changeStatus(queueId,data.code)">
            <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
            &nbsp; {{data.value}}
          </button>

          <button mat-menu-item *ngIf="data.value === 'CompleteRemarks'"
                  (click)="changeStatus(queueId,'QS-CO','remarks')">
            <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
            &nbsp; Complete with Remarks
          </button>

          <button mat-menu-item *ngIf="data.value === 'CompleteReview'"
                  (click)="changeStatus(queueId,'QS-CO','review')">
            <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
            &nbsp; Complete with Review
          </button>
        </ng-container>
      </ng-container>

      <ng-container *ngIf="['QS-WT','QS-NE','QS-RG'].includes(currentStatus) && currentStatus != 'QS-CO'">
        <button mat-menu-item *ngFor="let data of waitingmenu" (click)="changeStatus(queueId,data.code)">
          <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
          &nbsp; {{data.value}}
        </button>
      </ng-container>

      <ng-container *ngIf="currentStatus == 'QS-PE'">
        <button mat-menu-item *ngFor="let data of pendingmenu" (click)="changeStatus(queueId,data.code)">
          <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
          &nbsp; {{data.value}}
        </button>
      </ng-container>

      <ng-container *ngIf="currentStatus == 'QS-CO'">
        <ng-container *ngFor="let data of waitingmenu">
          <button mat-menu-item *ngIf="data.code === 'QS-PE'" (click)="changeStatus(queueId,'QS-PE')">
            <img src="/assets/Alert/common_icons/arrow-alt-circle-right-regular.svg" width="14px" alt="">
            &nbsp; Pending
          </button>
        </ng-container>
      </ng-container>
    </ng-container>
  </ng-template>
</mat-menu>
