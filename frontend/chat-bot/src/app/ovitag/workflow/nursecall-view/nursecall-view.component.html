<lazy-loader *ngIf=loading></lazy-loader>
<div class="manage-body">
    <tw-header-new-component [type]="'new'" [component]="'nursecall-view'" [permission]="null" [dateFilter]="null"
        [selectFilter]="selectFilter" [rowFilter]="rowFilter" [manageAction]="null" [selectDropdown]="null"
        [selectedName]="true" [alertCount]="count" [locationId]="locationId" [selectedView]="selectedView"
        (selectedViewAction)="selectedViewAction($event)" (headerEventAction)="headerEventAction($event)" [view]="null" [multiView]="enableMultiView"
        [groupFilter]="groupFilter"></tw-header-new-component>

    <div *ngIf="selectedView == 'new card' && false" style="height: 100%; width: 100%;">
        <app-card-view [component]="'nursecall-view'" (scrollAction)="scroll()"[view] = "ipView" [alertPatientId]="alertPatientId"
         [cardPatientInfo]="nurseViewData" ></app-card-view>
    </div>

    <div *ngIf="selectedView == 'card'" style="height: 100%; width: 100%;">
        <app-newcard-view [component]="'nursecall-view'" (scrollAction)="scroll()" (eventAction)="eventAction($event)"
            [alertSoundEvents] = "alertSoundEvents" [newCardInput]="nurseViewData" [view]="ipView"></app-newcard-view>
    </div>

    <div *ngIf="selectedView == 'table'">
        <tw-table-component [component]="'nursecall-view'" [columns]="displayedColumns"
            [tableData]="tableData" [iconHeader]="iconHeader" [iconColumn]="iconColumn" [sortColumn]="sortColumn"
            [eventColumn]="eventColumn" (eventAction)="tableEventAction($event)" [rowClick]="true" [rowOver]="true"
            [rowId]="'patientVisitId'"  [applyFilter]="applyFilterValue" [permissionControl]="permissionControl"
            [pagination]="[{length: length, pageSize: pageSize, pageStart: pageStart}]" [tableSize]="'138px'"></tw-table-component>
    </div>
</div>
