<div style="height: calc(100% - 60px); width: 100%;" *ngIf="tempVar && menuDetail['type'] != 'porter-request'">
    <app-form-component *ngIf="menuDetail['type'] == 'form'" [formInput] = "menuDetail['form']" (formInputUpdatedData)=formInputUpdatedData($event)></app-form-component>
    <div style=" padding: 0px 15px 0px 5px;" *ngIf="enableHeader">
        <tw-layout-header-component *ngIf="menuDetail['type'] == 'layout'" [layout]="'dynamic'" [enableExcel]="enableExcel" [enablePdf]="enablePdf" [enableRefresh]="enableRefresh" [pdfConfigSelected]="pdfConfigSelected" 
        [filterInputs]="filterInputs" [dashboardId]="dashboardId" (reportHeaderAction)="reportHeaderAction($event)"></tw-layout-header-component>
    </div>
    <div style="height:calc(100% - 85px);">
        <app-gridster-layout *ngIf="menuDetail['type'] == 'layout'" [dashId]="" [resourceCode]="resourceCode" [dashData]="" [inputAction]="inputAction"></app-gridster-layout>
    </div>
</div>
<div *ngIf="menuDetail['type'] == 'porter-request'">
    <app-porter-request-new [header]="false" [mobheight]="true"></app-porter-request-new>
</div>
