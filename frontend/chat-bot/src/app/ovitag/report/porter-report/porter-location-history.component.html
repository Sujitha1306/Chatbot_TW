<div class="custom-dialog-box" style="height:100%;width: 100%;">
    <mat-toolbar class="input-header block-1" style="height: 35px;">
        <div style="display: flex;width: 100%">
            <div class="header-name" style="width: 100%;">
                {{"Location History"|translate}}</div>
            <div class="header-close">
                <button mat-icon-button mat-dialog-close close-button class="ie-close-icon">
                    <mat-icon class="icon-style">highlight_off</mat-icon>
                </button>
            </div>
        </div>
    </mat-toolbar>
    <div *ngIf="showTable" style="margin: 2px 2px;">
        <angular-table-component [tableData]="tableData" [columns]="tableCol"></angular-table-component>
    </div>
    <div  *ngIf="!showTable" style="text-align: center;margin: 2% 0 0 -7%;">{{"No Records"|translate}}</div>
</div>
