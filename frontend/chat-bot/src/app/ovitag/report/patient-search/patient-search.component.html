<div class="mrgn-style ovi-font-family" [ngStyle]="pagebgcolor && {'background':pagebgcolor}">
    <div class="pat-srch-style">{{"Patient Search"|translate}}</div>
  <div class="manage-body">
    <div class="manage-action">
      <mat-form-field>
        <input matInput (keyup)="applyFilter($event.target.value)" [value]="filtervalue" placeholder="{{'Filter'|translate}}">
      </mat-form-field>
      <div class="manage-btn">
        <button mat-button class="action-btn" [disabled]="!btnenable" (click)="picupPatient()">{{"Ok"|translate}}</button>
        <button mat-button class="cancle-btn" mat-dialog-close>{{"Cancel"|translate}}</button>
      </div>
    </div>
    <div fxLayout="column" class="mat-elevation-z4 manage-component" [ngClass.xs]="'components-container-xs'"
      fxLayoutGap="5px">
      <div class="table-container mat-table-overflow" [ngStyle]="pagebgcolor && {'background':pagebgcolor}">
        <mat-table #table [dataSource]="dataSource" matSort >

          <!--  *******  O L D     C O D E  ******* -->

          <!-- <ng-container *ngFor = "let col of displayedData"  matColumnDef="{{col.colName}}" >
              <mat-header-cell *matHeaderCellDef mat-sort-header class="manage-table-header"> {{col.title}} </mat-header-cell>
              <mat-cell *matCellDef="let element">{{element[col.dataName]}} </mat-cell>
            </ng-container> -->

          <ng-container matColumnDef="firstName">
            <mat-header-cell *matHeaderCellDef mat-sort-header class="manage-table-header"> {{"Name"|translate}} </mat-header-cell>
            <mat-cell *matCellDef="let element">{{element.firstName}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="gender">
            <mat-header-cell *matHeaderCellDef mat-sort-header class="manage-table-header"> {{"Gender"|translate}} </mat-header-cell>
            <mat-cell *matCellDef="let element">{{element.gender}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="dob">
            <mat-header-cell *matHeaderCellDef mat-sort-header class="manage-table-header"> {{"DOB"|translate}}
            </mat-header-cell>
            <mat-cell *matCellDef="let element">{{element.birthDate}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="mobile">
            <mat-header-cell *matHeaderCellDef mat-sort-header class="manage-table-header"> {{"Mobile"|translate}} </mat-header-cell>
            <mat-cell *matCellDef="let element">{{element.mobileNo}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="email">
            <mat-header-cell *matHeaderCellDef mat-sort-header class="manage-table-header"> {{"Email"|translate}} </mat-header-cell>
            <mat-cell *matCellDef="let element">{{element.email}} </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns" class="manage-table-header-row" [ngStyle]="headercolor && {'background':headercolor}"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;" class="element-row" [ngStyle]="bgcolor && {'background':bgcolor}"
            [ngClass]="{'highlight' : row === selectedRow}" (click)=rowClick(row)  (keydown.enter)="fixClick()" 
            (toggleChange)="onToggleChange($event,row)">
          </mat-row>
        </mat-table>
        <mat-paginator [pageSizeOptions]="[10, 15, 20, 50, 100]" showFirstLastButtons></mat-paginator>
      </div>
    </div>
  </div>
</div>
