<div class="input-component-holder compnt-hgt" style="overflow-x: hidden;width: 850px;">
    <mat-toolbar class="input-header">
        <div class="header-name">{{"Log Info"|translate}}</div>
        <div class="header-close" style="padding-bottom: 10px;padding-top: 15px;"><button mat-icon-button mat-dialog-close close-button
                class="ie-close-icon">
                <mat-icon class="icon-style">highlight_off</mat-icon>
            </button></div>
    </mat-toolbar>
    <mat-tab-group style="overflow: auto;height: 550px;">
        <mat-tab *ngIf="data.stackTraceLogdata !== undefined && data.stackTraceLogdata !== null && data.stackTraceLogdata !== ''" label="{{'Stack Trace'|translate}}">
            <div class="mat-tab-content">
                <div class="log-data-popup">
                    {{data.stackTraceLogdata}}
                </div>
            </div>
        </mat-tab>
        <mat-tab *ngIf="data.additonalInfoLogdata !== undefined && data.additonalInfoLogdata !== null && data.additonalInfoLogdata !== ''" label="{{'Additional Info'|translate}}">
            <div class="mat-tab-content">
                <div class="log-data-popup">
                    {{data.additonalInfoLogdata}}
                </div>
            </div>
        </mat-tab>
        <mat-tab *ngIf="data.errorMessageLogdata !== undefined && data.errorMessageLogdata !== null && data.errorMessageLogdata !== '' && data.errorMessageLogdata !== 'null'" label="Error Message">
            <div style="padding-left: 94%;padding-top: 10px;background-color: #c1c2c226;">
                <img src="/assets/Alert/common_icons/copy1.png" alt="copy.image" width=30px style="cursor: pointer;" matTooltip="{{'Copy Message'|translate}}"
                    (click)="copyErrorMessage(data.errorMessageLogdata)" (keydown.enter)="fixClick()" >
            </div>
            <div class="mat-tab-content">
                <div class="log-data-popup" style="width: 90%;">
                    {{data.errorMessageLogdata}}
                </div>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
