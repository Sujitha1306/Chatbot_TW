<!-- Heart monitor icon (yellow) -->
<svg
  width="64" height="64" viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Heart monitor icon</title>
  <desc id="desc">A yellow heart with an ECG pulse line inside</desc>

  <!-- Heart -->
  <path
    d="M32 58s-4.3-3.3-8.6-6.6C12 43 4 36 4 26 4 17.7 10.7 12 18.9 12c4.9 0 9.6 2.4 12.1 6.1C33.5 14.4 38.2 12 43.1 12 51.3 12 58 17.7 58 26c0 10-8 17-19.4 25.4C36.3 54.7 32 58 32 58z"
    fill="#FFC107"/>
  
  <!-- ECG pulse -->
  <polyline
    points="14,34 22,34 26,26 30,42 36,28 39,34 50,34"
    fill="none" stroke="#FFFFFF" stroke-width="3.2"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
