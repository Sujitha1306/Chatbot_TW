server {
        listen       80 default_server;
        listen       [::]:80 default_server;

        # location / {
        # 	root         /usr/share/nginx/html;
        #     index  index.html index.htm;
		#     try_files $uri $uri/ /index.html;
        # }

 location / {
             alias   /usr/share/nginx/html/en/;
             try_files $uri$args $uri$args/ /en/index.html;

         }
  
         location /en/ {
             alias   /usr/share/nginx/html/en/;
             try_files $uri$args $uri$args/ /en/index.html;
         }
         
        location /en-US/ {
             alias   /usr/share/nginx/html/en-US/;
             try_files $uri$args $uri$args/ /en-US/index.html;
         }
          
         location /de/ {
             alias   /usr/share/nginx/html/de/;
             try_files $uri$args $uri$args/ /de/index.html;
         }
         
         location /ar/ {
             alias   /usr/share/nginx/html/ar/;
             try_files $uri$args $uri$args/ /ar/index.html;
         }
  
         location /fr/ {
             alias   /usr/share/nginx/html/fr/;
             try_files $uri$args $uri$args/ /fr/index.html;
         }        
  
         # redirect server error pages to the static page /40x.html
         #
         error_page 404 /404.html;
	             location = /40x.html {
                    alias   /usr/share/nginx/html/en/;
 
         }
  
         # redirect server error pages to the static page /50x.html
         #
         error_page 500 502 503 504 /50x.html;
             location = /50x.html {
             alias   /usr/share/nginx/html/en/;

         }
}
